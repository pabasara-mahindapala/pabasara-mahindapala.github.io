- title: "Beyond Data Residency: Compensating Controls for Sovereign Management of NHS Patient Data on AWS under the DSP Toolkit"
  authors: ["B.M.P.D. Balasooriya", "D.P.P. Mahindapala"]
  venue: "APIIT International Research Conference 2026 (AIRC 2026)"
  date: 2026-10-01
  isbn: "978-624-6201-21-0"
  status: published
  award: "Best Paper Award"
  summary: >-
    Hosting NHS patient data in the AWS London Region settles where the data is stored.
    It does not settle who can act on it, because AWS is administered through a global management plane.
    The paper reviews 36 studies and finds no peer-reviewed work that maps the NHS Data Security and Protection (DSP) Toolkit v8 to concrete AWS controls.
    It proposes four compensating controls and tests them in a sandbox AWS organisation.
  points:
    - "Customer-managed KMS keys keep decryption authority with the NHS."
    - "Service Control Policies confine administrative action to the London Region."
    - "An organisation-wide CloudTrail trail, written to an immutable S3 bucket, makes every privileged action auditable."
    - "A self-hosted WSO2 API Manager gateway sits in front of all access to patient data."
  keywords: [AWS, NHS DSP Toolkit, UK GDPR, Data sovereignty, Cloud security]

- title: "Cost-Optimization Algorithm Comparison for Fresh Crop Transportation in Sri Lanka"
  venue: "Undergraduate research, University of Ruhuna"
  year: 2021
  summary: >-
    Compared optimization methods to find the most suitable approach for minimizing the cost of transporting fresh crops in Sri Lanka.
    The findings were applied to build an agricultural marketing and transportation platform.
  keywords: [Optimization, Logistics, Agriculture]
